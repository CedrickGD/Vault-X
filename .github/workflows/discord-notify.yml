name: Discord Notify

on:
  push:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed('Missing DISCORD_WEBHOOK_URL secret.');
              return;
            }

            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const eventName = context.eventName;
            const actor = context.actor;
            const embeds = [];
            let content = `Repository activity in ${repo}`;

            if (eventName === 'push') {
              const ref = context.ref.startsWith('refs/heads/')
                ? context.ref.replace('refs/heads/', '')
                : context.ref.replace('refs/tags/', 'tag ');
              const commits = (context.payload.commits || []).slice(-5);
              const commitLines = commits.map((commit) => {
                const title = (commit.message || '').split('\n')[0] || '(no message)';
                const shortSha = (commit.id || '').slice(0, 7);
                return `[\`${shortSha}\`](${commit.url}) ${title} - ${commit.author?.name || 'unknown'}`;
              });

              content = `Push by ${actor} to \`${ref}\``;
              embeds.push({
                title: `${repo} push`,
                url: context.payload.compare || `https://github.com/${repo}`,
                color: 0x5865F2,
                description: commitLines.join('\n') || 'No commit details were included in the payload.',
                fields: [
                  {
                    name: 'Branch',
                    value: `\`${ref}\``,
                    inline: true
                  },
                  {
                    name: 'Commit Count',
                    value: String((context.payload.commits || []).length),
                    inline: true
                  },
                  {
                    name: 'Pusher',
                    value: context.payload.pusher?.name || actor,
                    inline: true
                  }
                ],
                timestamp: new Date().toISOString()
              });
            } else if (eventName === 'release') {
              const release = context.payload.release;
              const body = (release.body || 'Release published.').slice(0, 4000);

              content = `Release published by ${actor}: \`${release.tag_name}\``;
              embeds.push({
                title: release.name || release.tag_name,
                url: release.html_url,
                color: 0x57F287,
                description: body,
                fields: [
                  {
                    name: 'Tag',
                    value: `\`${release.tag_name}\``,
                    inline: true
                  },
                  {
                    name: 'Target',
                    value: `\`${release.target_commitish || 'unknown'}\``,
                    inline: true
                  },
                  {
                    name: 'Assets',
                    value: String(release.assets?.length || 0),
                    inline: true
                  }
                ],
                timestamp: release.published_at || new Date().toISOString()
              });
            } else {
              content = `Workflow event: ${eventName}`;
              embeds.push({
                title: `${repo} workflow event`,
                url: `https://github.com/${repo}/actions/runs/${context.runId}`,
                color: 0xFEE75C,
                description: `Triggered by ${actor}.`,
                timestamp: new Date().toISOString()
              });
            }

            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: 'VaultX Notifications',
                content,
                embeds
              })
            });

            if (!response.ok) {
              const body = await response.text();
              core.setFailed(`Discord webhook failed (${response.status}): ${body}`);
            }
